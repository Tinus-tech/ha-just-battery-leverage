title: Batterij Trader
views:
  - title: Overzicht
    path: overzicht
    icon: mdi:home-battery
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: ⚡ Strategie
            heading_style: title
          - type: tile
            entity: select.just_leverage_battery_batterij_strategie_kiezer
            name: Strategie
            features:
              - type: select-options
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: sensor.just_leverage_battery_batterij_laatste_actie
            name: Laatste Actie
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.just_leverage_battery_batterij_soc
            name: Batterij SOC
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.just_leverage_battery_batterij_beslissingsreden
            name: Reden
            grid_options:
              columns: 12
              rows: 1
      - type: grid
        cards:
          - type: heading
            heading: 📅 Arbitrage Planning
            heading_style: title
          - type: tile
            entity: sensor.just_leverage_battery_batterij_prijs_delta
            name: Prijs Delta
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.just_leverage_battery_batterij_arbitrage_planning
            name: Planning
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.just_leverage_battery_batterij_volgend_laadmoment
            name: Volgend Laadmoment
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.just_leverage_battery_batterij_volgend_ontlaadmoment
            name: Volgend Ontlaadmoment
            grid_options:
              columns: 6
              rows: 1
          - type: markdown
            title: Planning details
            content: |
              **Verwachte winst:** €{{ state_attr('sensor.just_leverage_battery_batterij_arbitrage_planning', 'expected_profit') }}

              | Tijd | Actie | Prijs | SOC |
              |------|-------|-------|-----|
              {% for h in state_attr('sensor.just_leverage_battery_batterij_arbitrage_planning', 'hours') %}
              {%- if h.action != 'idle' %}
              | {{ h.time }} | {{ {'charge':'🔋 laden','discharge':'⚡ ontladen'}[h.action] }} | €{{ '%.3f'|format(h.price) }} | {{ h.soc }}% |
              {%- endif %}
              {%- endfor %}
            grid_options:
              columns: 12
              rows: auto
          - type: heading
            heading: 💰 Winst
            heading_style: title
          - type: tile
            entity: sensor.just_leverage_battery_winst_vandaag
            name: Vandaag
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.just_leverage_battery_totale_winst
            name: Totaal
            grid_options:
              columns: 6
              rows: 1
          - type: entities
            entities:
              - entity: sensor.marstek_venus_modbus_ac_vermogen
              - entity: sensor.marstek_venus_modbus_omvormer_status
              - entity: select.marstek_venus_modbus_gebruikersmodus
          - type: gauge
            entity: sensor.marstek_venus_modbus_batterij_soc
            needle: true
      - type: grid
        cards:
          - type: heading
            heading: 🔄 Zelfconsumptie (PID)
            heading_style: title
          - type: tile
            entity: sensor.just_leverage_battery_netwerk_vermogen_gemeten
            name: Netafname Nu
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.just_leverage_battery_pid_batterijcommando
            name: PID Commando
            grid_options:
              columns: 6
              rows: 1
          - type: heading
            heading: 🕐 Tijdschema
            heading_style: title
          - type: tile
            entity: sensor.just_leverage_battery_tijdschema_actief_blok
            name: Actief Blok
            grid_options:
              columns: 12
              rows: 1
          - type: custom:plotly-graph
            hours_to_show: 30
            refresh_interval: 600
            time_offset: 27h
            disable_pinch_to_zoom: true
            fn: |
              $fn ({ hass, vars, getFromConfig }) => {
                const hours_to_show = getFromConfig('hours_to_show');
                const time_offset = parseInt(getFromConfig('time_offset'));
                vars.x = []; vars.y = []; vars.color = []; vars.hover = []
                vars.min = {p: 999,t: null};
                vars.max = {p:-999,t:null};
                vars.ymin = 999;
                vars.ymax = -999;
                vars.unit_of_measurement = hass.states['sensor.zonneplan_current_electricity_tariff'].attributes.unit_of_measurement
                vars.now = {t: Date.now(), p: parseFloat(hass.states['sensor.zonneplan_current_electricity_tariff'].state)}
                vars.now.h = "<b>" + vars.now.p.toFixed(3) + "</b> " + vars.unit_of_measurement + " @now "
                vars.avg = { p: 0, c: 0 }
                let start = new Date();
                start.setHours(start.getHours() - (hours_to_show - time_offset));
                let end = new Date();
                end.setHours(start.getHours() + hours_to_show - 1);
                hass.states['sensor.zonneplan_current_electricity_tariff']?.attributes?.forecast?.map(e => {
                  if (start >= new Date(e.datetime) || end <  new Date(e.datetime)) return;
                  var t = new Date(e.datetime).getTime()+1800000
                  var p = e.electricity_price/10000000
                  vars.avg.p += p
                  vars.avg.c++
                  var c = e.tariff_group.replace("low", "#00a964").replace("normal", "#365651").replace("high","#ed5e18")
                  if (t>=Date.now()-1800000) {
                    if (p<vars.min.p) vars.min = {p,t,c}
                    if (p>vars.max.p) vars.max = {p,t,c}
                  }

                  if (p<vars.ymin) vars.ymin = p
                  if (p>vars.ymax) vars.ymax = p
                  vars.x.push(t)
                  vars.y.push(p)
                  vars.color.push(c)
                  vars.hover.push(String(new Date(t).getHours()).padStart(2,"0") + "-" +
                    String(new Date((new Date(t).getTime()+3600000)).getHours()).padStart(2,"0") + ": <b>" +
                    p.toFixed(3) + "</b> " + vars.unit_of_measurement)
                })
                vars.min.h = "<b>" + vars.min.p.toFixed(3) + "</b> " + vars.unit_of_measurement + " @ " + new Date(vars.min.t).getHours() + ":00"
                vars.max.h = "<b>" + vars.max.p.toFixed(3) + "</b> " + vars.unit_of_measurement + " @ " +  new Date(vars.max.t).getHours() + ":00"
                vars.avg.p = vars.avg.p / vars.avg.c
                vars.avg.h = "<b>" + vars.avg.p.toFixed(3) + "</b> " + vars.unit_of_measurement + " average"
                //console.log(vars, hass.states['sensor.zonneplan_current_electricity_tariff']?.attributes?.forecast);
              }
            layout:
              margin:
                l: 20
                r: 20
                b: 40
              dragmode: false
              clickmode: none
              legend:
                itemclick: false
                itemdoubleclick: false
              yaxis:
                fixedrange: false
                tickformat: .2f
                range: $fn ({vars}) => [ vars.ymin-0.02, vars.ymax+0.02 ]
                showgrid: false
                visible: false
                showticklabels: true
                showline: false
                title: null
              xaxis:
                tickformat: '%H'
                showgrid: false
                visible: true
                showticklabels: true
                showline: false
                dtick: 3600000
            config:
              displayModeBar: true
              scrollZoom: false
              doubleClick: false
            entities:
              - entity: ''
                unit_of_measurement: $ex vars.unit_of_measurement
                showlegend: false
                x: $ex vars.x
                'y': $ex vars.y
                marker:
                  color: $ex vars.color
                type: bar
                hovertemplate: $ex vars.hover
              - entity: ''
                mode: markers
                textposition: top
                showlegend: true
                name: $ex vars.min.h
                hovertemplate: $ex vars.min.h
                yaxis: y0
                marker:
                  symbol: diamond
                  color: $ex vars.min.c
                  opacity: 0.7
                x:
                  - $ex vars.min.t
                'y':
                  - $ex vars.min.p
              - entity: ''
                mode: markers
                textposition: top
                showlegend: true
                name: $ex vars.max.h
                hovertemplate: $ex vars.max.h
                yaxis: y0
                marker:
                  symbol: diamond
                  color: $ex vars.max.c
                  opacity: 0.7
                x:
                  - $ex vars.max.t
                'y':
                  - $ex vars.max.p
              - entity: ''
                name: Now
                hovertemplate: Now
                yaxis: y9
                showlegend: false
                line:
                  width: 0.5
                  color: gray
                  opacity: 1
                x: $ex [vars.now.t, vars.now.t]
                'y':
                  - 0
                  - 1
          - type: markdown
            content: >-

              {% set timezone_offset = 2 %} {# Verander 2 naar je gewenste
              offset in uren #}

              {% set cheapest_hour_next_fifteen_hours =

              state_attr('sensor.zonneplan_current_electricity_tariff',
              'forecast') |

              selectattr('datetime', '>', utcnow().isoformat()) |

              selectattr('datetime', '<', (utcnow() + timedelta(hours =
              20)).isoformat())

              | sort(attribute='electricity_price') %}

              {% if cheapest_hour_next_fifteen_hours | length > 0 %}

              {% set cheapest_hour = cheapest_hour_next_fifteen_hours | first %}

              {% set cheapest_hour_local_time =
              as_timestamp(strptime(cheapest_hour.datetime,
              '%Y-%m-%dT%H:%M:%S.%fZ')) + timezone_offset * 3600 %}

              De goedkoopste tijd is {{ 'vandaag' if
              as_timestamp(utcnow())|timestamp_custom('%Y-%m-%d') ==
              cheapest_hour_local_time|timestamp_custom('%Y-%m-%d') else
              'morgen' }} om {{
              (cheapest_hour_local_time)|timestamp_custom('%H') }} uur en kost
              €{{"{:.2f}".format(cheapest_hour.electricity_price_excl_tax|float/10000000)
              }}/kWh.
                {% endif %}

                {%- set cheapest_forecast =
                state_attr('sensor.zonneplan_current_electricity_tariff', 'forecast') |
                selectattr('datetime', '>', utcnow().isoformat()) | selectattr('datetime',
                '<', (utcnow() + timedelta(hours = 15)).isoformat()) | list |
                sort(attribute='electricity_price_excl_tax') | first %}

                {%- set expensive_forecast =
                state_attr('sensor.zonneplan_current_electricity_tariff', 'forecast') |
                selectattr('datetime', '>', utcnow().isoformat()) | selectattr('datetime',
                '<', (utcnow() + timedelta(hours = 15)).isoformat()) | list |
                sort(attribute='electricity_price_excl_tax') | last %}

                {%- for forecast in
                state_attr('sensor.zonneplan_current_electricity_tariff', 'forecast') |
                selectattr('datetime', '>', utcnow().isoformat()) | selectattr('datetime',
                '<', (utcnow() + timedelta(hours = 15)).isoformat()) | list |
                sort(attribute='datetime') %}

                {%- set forecast_local_time = as_timestamp(strptime(forecast.datetime, '%Y-%m-%dT%H:%M:%S.%fZ')) + timezone_offset * 3600 %}
                • {{ (forecast_local_time)|timestamp_custom('%H:%M') }}    €{{ (forecast.electricity_price / 10000000) | round(2) }} (€{{ (forecast.electricity_price_excl_tax / 10000000) | round(2) }} excl.) {% if forecast == cheapest_forecast %}⭐{% endif %}{% if forecast == expensive_forecast %}🔴{% endif %}
                {%- endfor %}
    header:
      card:
        type: markdown
        text_only: true
        content: |-
          # Hallo {{ user }}
          Here is a dashboard to manage your battery ✨
