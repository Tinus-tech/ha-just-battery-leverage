<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Just Leverage Battery icon - dark variant (for dark backgrounds) -->
  <g>
    <!-- buy-low arrow (left, green, pointing up) -->
    <polygon points="40,96 22,128 58,128" fill="#22c55e"/>
    <rect x="32" y="128" width="16" height="38" rx="5" fill="#22c55e"/>

    <!-- sell-high arrow (right, amber, pointing down) -->
    <rect x="208" y="96" width="16" height="32" rx="5" fill="#fbbf24"/>
    <polygon points="198,128 234,128 216,166" fill="#fbbf24"/>

    <!-- battery terminal -->
    <rect x="114" y="38" width="28" height="22" rx="6" fill="none" stroke="#e2e8f0" stroke-width="8"/>

    <!-- battery body -->
    <rect x="86" y="58" width="84" height="152" rx="18" fill="none" stroke="#e2e8f0" stroke-width="8"/>

    <!-- charge level bars -->
    <rect x="119" y="176" width="18" height="14" rx="6" fill="#38bdf8" opacity="0.3"/>
    <rect x="119" y="156" width="18" height="16" rx="6" fill="#38bdf8" opacity="0.5"/>
    <rect x="119" y="134" width="18" height="18" rx="6" fill="#38bdf8" opacity="0.75"/>
    <rect x="119" y="110" width="18" height="20" rx="6" fill="#38bdf8"/>
  </g>
</svg>
